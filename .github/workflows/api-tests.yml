name: API tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: api-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  newman:
    name: Newman
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the committed collection matches the generator
        run: |
          npm run build
          git diff --exit-code -- collections/restful-booker.postman_collection.json

      - name: Run the collection
        run: npm run test:run

      - name: Upload Newman reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: |
            reports/newman-report.html
            reports/junit.xml
          if-no-files-found: warn
          retention-days: 14
